name: BOME Upload Bot

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        pip install playwright yt-dlp
        playwright install chromium
        playwright install-deps
    
    - name: Download history file
      run: touch history.txt
    
    - name: Run upload script
      env:
        YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
      run: |
        python upload_bot.py
    
    - name: Commit and push updated history
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add history.txt
        git commit -m "Update history" || echo "No changes to commit"
        git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main