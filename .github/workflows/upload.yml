name: YouTube Shorts Uploader

on:
  schedule:
    # Run every day at 10:00 AM UTC
    - cron: '0 10 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
      
      - name: Run YouTube uploader
        env:
          COOKIES_BASE64: ${{ secrets.COOKIES_BASE64 }}
        run: python upload_bot.py
      
      - name: Commit uploaded.txt changes
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add uploaded.txt history.txt || true
          git commit -m "Update upload tracking - $(date +'%Y-%m-%d %H:%M:%S')" || true
          git push
      
      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: uploader-logs-${{ github.run_id }}
          path: |
            uploaded.txt
            history.txt
          retention-days: 30